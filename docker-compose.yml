version: "3.8"

services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: loginpage-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  # ── Node.js App ──
  app:
    build: .
    container_name: loginpage-app
    restart: unless-stopped
    ports:
      - "3006:3000"
    depends_on:
      - mongo
      - ml_service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/loginpage
      SESSION_SECRET: change-me-in-production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}

  # ── FastAPI ML Microservice ──
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    volumes:
      - ./ml_service:/app
      - ./ml_service/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  mongo-data: